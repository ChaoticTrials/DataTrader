modLoader="javafml"
loaderVersion="[4,)"
license="${mod.license}"
issueTrackerURL="${mod.issue_url}"

[[mods]]
modId="${mod.modid}"
version="${mod.version}"
displayName="Data Trader"
displayURL="${mod.source_url}"
updateJSONURL="https://assets.melanx.de/updates/data-trader.json"
authors="MelanX"
description="""
Adds a trader to the game which can be customized by datapacks.
"""

[[dependencies.${mod.modid}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${mod.neoforge},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod.modid}]]
    modId="minecraft"
    type="required"
    versionRange="[${mod.minecraft},)"
    ordering="NONE"
    side="BOTH"
